# Default configuration for git-gk-optimize

tags:
  # Keep 100% of tags that do not match any pattern in keep_recent_by_pattern.
  keep_other_tags: true

  # Minimum hours between background tag prune passes (unless packed-refs spikes >8 KB).
  prune_interval_hours: 12.0

  # Glob pattern -> number of newest tags (by creatordate) to retain locally.
  keep_recent_by_pattern:
    "candidate/*": 5
    "release/*": 5
    "platform/*": 5

  # Historical tag globs excluded from CLI `git fetch` via `^refs/tags/<pattern>`.
  blocked_fetch_patterns:
    - "candidate/20*"
    - "platform/20*"
    - "release/20*"

watcher:
  # Real directory names hidden from GitKraken's NSFW (@axosoft/nsfw) inotify
  # crawler. (Working-tree symlinks such as bazel-* are already skipped
  # globally via lstat64 while symlinked .git roots and parent-dir symlink
  # changes remain tracked.)
  ignored_dirs:
    - "node_modules"
    - ".venv"
    - ".pixi"
    - "target"
    - ".cache"
    - ".pnpm-store"
    - ".mypy_cache"
    - ".ruff_cache"
    - "__pycache__"
    - ".pytest_cache"
