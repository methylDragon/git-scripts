[workspace]
authors = ["methylDragon <methylDragon@google.com>"]
channels = ["conda-forge"]
name = "git-scripts"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
setup = "prek install -f --prepare-hooks"
lint = "ruff check --fix src/ tests/ media-gen/ && pyright src/ tests/ media-gen/ && prek run --all-files"
format = "ruff format src/ tests/ media-gen/ && prek run --group format --all-files"
test = "pytest -n auto tests/"
coverage = "pytest --cov=src/git_scripts --cov-report=term-missing tests/"
git-rebase-prefix = "python -m git_scripts.cli rebase-prefix"
git-push-prefix = "python -m git_scripts.cli push-prefix"
git-push-stack = "python -m git_scripts.cli push-stack"
git-evolve = "python -m git_scripts.cli evolve"
git-prune-local = "python -m git_scripts.cli prune-local"
git-prune-remote-prefix = "python -m git_scripts.cli prune-remote-prefix"
git-gk-optimize = "python -m git_scripts.cli gk-optimize"
build-gk-shim = "cmake --fresh -S src/git_scripts/gk/optimize/csrc -B build/gk_shim -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build/gk_shim"

# --- Media Generation ---
media-gen = "python media-gen/generate.py"
media-gen-all = "python media-gen/generate.py --all"

[dependencies]
pyright = ">=1.1.300,<2"
pygit2 = ">=1.19.3,<2"
rich = ">=15.0.0,<16"
questionary = ">=2.1.1,<3"
absl-py = ">=2.5.0,<3"
ruff = ">=0.16.0,<0.17"
pytest = ">=8.3.4,<9"
pydantic = ">=2.13.4,<3"
pyyaml = ">=6.0.2,<7"
pytest-xdist = ">=3.8.0,<4"
prek = ">=0.1.0"
typer = ">=0.27.0,<0.28"
filelock = ">=3.16.1,<4"
act = ">=0.2.89,<0.3"
vhs = ">=0.11.0,<0.12"
pyfiglet = ">=1.0.4,<2"
inflect = ">=7.5.0,<8"

[target.linux-64.dependencies]
c-compiler = "*"
cmake = ">=3.28,<5"
ninja = ">=1.11,<2"

[pypi-dependencies]
git-scripts = { path = ".", editable = true }
pytest-cov = ">=7.1.0, <8"

