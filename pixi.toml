[workspace]
authors = ["methylDragon <methylDragon@google.com>"]
channels = ["conda-forge"]
name = "git-scripts"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
setup = "pre-commit install-hooks && pre-commit install"
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
test = "pytest -n auto tests/"
git-rebase-prefix = "python -m git_scripts.cli rebase_prefix"
git-push-prefix = "python -m git_scripts.cli push_prefix"
git-evolve = "python -m git_scripts.cli evolve"
git-prune-local-branches = "python -m git_scripts.cli prune_local_branches"
git-prune-remote-prefix = "python -m git_scripts.cli prune_remote_prefix"

[dependencies]
pygit2 = ">=1.19.3,<2"
rich = ">=15.0.0,<16"
questionary = ">=2.1.1,<3"
absl-py = ">=2.5.0,<3"
ruff = ">=0.16.0,<0.17"
pytest = ">=8.3.4,<9"
pydantic = ">=2.13.4,<3"
pytest-xdist = ">=3.8.0,<4"
pre-commit = ">=4.6.1,<5"
typer = ">=0.27.0,<0.28"
filelock = ">=3.16.1,<4"

[pypi-dependencies]
git-scripts = { path = ".", editable = true }
pytest-cov = ">=7.1.0, <8"
