[workspace]
authors = ["methylDragon <methylDragon@google.com>"]
channels = ["conda-forge"]
name = "git-scripts"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
setup = "pre-commit install-hooks && pre-commit install"
lint = "ruff check --fix src/ tests/ media-gen/ && pyright src/ tests/ media-gen/ && pre-commit run --all-files"
format = "ruff format src/ tests/ media-gen/ && pre-commit run mdformat --all-files && pre-commit run markdownlint --all-files"
test = "pytest -n auto tests/"
coverage = "pytest --cov=src/git_scripts --cov-report=term-missing tests/"
git-rebase-prefix = "python -m git_scripts.cli rebase-prefix"
git-push-prefix = "python -m git_scripts.cli push-prefix"
git-push-stack = "python -m git_scripts.cli push-stack"
git-evolve = "python -m git_scripts.cli evolve"
git-prune-local = "python -m git_scripts.cli prune-local"
git-prune-remote-prefix = "python -m git_scripts.cli prune-remote-prefix"

# --- Media Generation ---
media-gen = "python media-gen/generate.py"
media-gen-all = "python media-gen/generate.py --all"

[dependencies]
pyright = ">=1.1.300,<2"
pygit2 = ">=1.19.3,<2"
rich = ">=15.0.0,<16"
questionary = ">=2.1.1,<3"
absl-py = ">=2.5.0,<3"
ruff = ">=0.16.0,<0.17"
pytest = ">=8.3.4,<9"
pydantic = ">=2.13.4,<3"
pytest-xdist = ">=3.8.0,<4"
pre-commit = ">=4.6.1,<5"
typer = ">=0.27.0,<0.28"
filelock = ">=3.16.1,<4"
act = ">=0.2.89,<0.3"
vhs = ">=0.11.0,<0.12"
pyfiglet = ">=1.0.4,<2"

[pypi-dependencies]
git-scripts = { path = ".", editable = true }
pytest-cov = ">=7.1.0, <8"
