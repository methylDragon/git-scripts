[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-scripts"
version = "0.1.0"
dependencies = [
    "filelock",
    "inflect",
    "pydantic",
    "pygit2",
    "pyyaml",
    "questionary",
    "rich",
    "typer",
]

[project.scripts]
git-batch = "git_scripts.cli:main"
git-evolve = "git_scripts.cli:main"
git-gh = "git_scripts.cli:main"
git-gk = "git_scripts.cli:main"
